<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BioNexus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, #eef5f0 0%, #dce8e0 100%);
            --card-bg: rgba(255, 255, 255, 0.78);
            --text-primary: #1a2e2a;
            --text-secondary: #2c5a4a;
            --border-light: rgba(42, 157, 143, 0.25);
            --shadow: 0 8px 32px rgba(0, 40, 20, 0.08);
            --accent: #2A9D8F;
            --accent-dark: #1F6E43;
            --glass-blur: blur(12px);
        }

        body.dark {
            --bg-gradient: radial-gradient(circle at 10% 20%, #1a2a25 0%, #0e1f1a 100%);
            --card-bg: rgba(30, 40, 35, 0.85);
            --text-primary: #e2f0e8;
            --text-secondary: #a8d5c5;
            --border-light: rgba(42, 157, 143, 0.4);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border-radius: 2rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .glass-card:hover { transform: translateY(-4px); border-color: var(--accent); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
        }
        .btn-primary:hover { transform: scale(1.02); opacity: 0.95; }
        .btn-sec {
            background: rgba(100, 120, 110, 0.7);
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-light);
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            color: var(--text-primary);
            width: 100%;
            max-width: 100%;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1F6E43, #0a2a1f);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 2rem;
            transition: opacity 1s ease;
        }
        .splash-logo { font-size: 5rem; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 0 #fff; }
            50% { transform: scale(1.05); text-shadow: 0 0 20px #a8ffd0; }
            100% { transform: scale(1); text-shadow: 0 0 0 #fff; }
        }
        .loading-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: white; animation: loadProgress 2s ease forwards; }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        .toggle-dark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .feedback-msg {
            padding: 0.8rem;
            border-radius: 1rem;
            margin: 0.8rem 0;
            background: rgba(42, 157, 143, 0.2);
            border-left: 4px solid var(--accent);
            text-align: left;
        }
        .feedback-error {
            background: rgba(220, 80, 60, 0.15);
            border-left-color: #d9534f;
        }
        .info-box {
            background: rgba(42, 157, 143, 0.1);
            border-radius: 1rem;
            padding: 0.8rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        @media (max-width: 720px) { body { padding: 1rem; } }
    </style>
</head>
<body>
<div id="root"></div>
<div class="toggle-dark" id="darkModeToggle"><i class="fas fa-moon"></i></div>

<script>
    // ==================== CONSTANTES ====================
    const STUDENT_CODE = "MLXFBIOLOGIACVE";
    const TEACHER_CODE = "441044";

    // ==================== VERIFICAÇÃO DE SESSÃO (localStorage) ====================
    let savedUser = localStorage.getItem("nexus_logged_user");
    if (savedUser) {
        try {
            let user = JSON.parse(savedUser);
            if (user.type === "professor") {
                window.location.href = "professor.html";
            } else if (user.type === "student") {
                window.location.href = "aluno.html";
            }
        } catch(e) {
            localStorage.removeItem("nexus_logged_user");
        }
    }

    // ==================== SPLASH E LOGIN ====================
    function showSplash(callback) {
        const root = document.getElementById("root");
        root.innerHTML = `
            <div class="splash-screen" id="splash">
                <div class="splash-logo"><i class="fas fa-dna"></i></div>
                <h2 style="color:white;">BioNexus Education</h2>
                <div class="loading-bar"><div class="loading-progress"></div></div>
                <p style="color:white;">Carregando...</p>
            </div>
        `;
        setTimeout(() => {
            let splash = document.getElementById("splash");
            if (splash) {
                splash.style.opacity = "0";
                setTimeout(() => {
                    splash.remove();
                    if (callback) callback();
                }, 1000);
            } else if (callback) callback();
        }, 2000);
    }

    function renderLoginScreen() {
        const root = document.getElementById("root");
        root.innerHTML = `
            <div class="container" style="max-width: 500px; margin: 10vh auto;">
                <div class="glass-card" style="padding: 2rem; text-align: center;">
                    <i class="fas fa-brain" style="font-size: 3rem; color: var(--accent);"></i>
                    <h1 style="margin: 0.5rem 0;">BioNexus</h1>
                    <p>Plataforma de Biologia</p>
                    <div style="margin: 2rem 0;">
                        <button id="showTeacherLogin" class="btn-primary" style="width: 100%; margin-bottom: 1rem;"><i class="fas fa-chalkboard-user"></i> Acesso Professor</button>
                        <button id="showStudentLogin" class="btn-primary" style="width: 100%; background: linear-gradient(135deg,#3a6b5e,#2A9D8F);"><i class="fas fa-user-graduate"></i> Acesso Aluno</button>
                    </div>
                    <div id="dynamicLoginArea"></div>
                </div>
            </div>
        `;
        document.getElementById("showTeacherLogin").onclick = () => showTeacherLoginForm();
        document.getElementById("showStudentLogin").onclick = () => showStudentLoginForm();
    }

    // ==================== PROFESSOR ====================
    function showTeacherLoginForm() {
        const area = document.getElementById("dynamicLoginArea");
        area.innerHTML = `
            <input type="password" id="teacherCode" placeholder="Código do Professor" />
            <button id="confirmTeacherCode" class="btn-primary" style="margin-top:1rem;">Entrar</button>
            <div id="teacherMsg"></div>
        `;
        document.getElementById("confirmTeacherCode").onclick = () => {
            let code = document.getElementById("teacherCode").value;
            if (code === TEACHER_CODE) {
                localStorage.setItem("nexus_logged_user", JSON.stringify({ type: "professor", name: "Ivanderlete" }));
                window.location.href = "professor.html";
            } else {
                document.getElementById("teacherMsg").innerHTML = "<div class='feedback-msg feedback-error'>❌ Código inválido!</div>";
            }
        };
    }

    // ==================== ALUNO ====================
    function showStudentLoginForm() {
        const area = document.getElementById("dynamicLoginArea");
        area.innerHTML = `
            <input type="text" id="studentName" placeholder="Seu nome completo" />
            <input type="password" id="studentCode" placeholder="Código de acesso" />
            <button id="doStudentLogin" class="btn-primary" style="margin-top:1rem;">Entrar</button>
            <div id="studentMsg"></div>
            <div class="info-box">
                🔐 Código do aluno: <strong>MLXFBIOLOGIACVE</strong><br>
                💡 Caso não tenha conta, informe seu nome e o código acima – sua conta será criada automaticamente.
            </div>
        `;
        document.getElementById("doStudentLogin").onclick = () => {
            let name = document.getElementById("studentName").value.trim();
            let code = document.getElementById("studentCode").value;
            if (!name) {
                document.getElementById("studentMsg").innerHTML = "<div class='feedback-msg feedback-error'>❌ Digite seu nome.</div>";
                return;
            }
            if (code !== STUDENT_CODE) {
                document.getElementById("studentMsg").innerHTML = "<div class='feedback-msg feedback-error'>❌ Código inválido!</div>";
                return;
            }
            // Recupera ou cria aluno no localStorage
            let students = JSON.parse(localStorage.getItem("nexus_students") || "[]");
            let existing = students.find(s => s.name.toLowerCase() === name.toLowerCase());
            if (!existing) {
                students.push({ name: name, progress: { totalXP: 0, level: 1, lastDaily: null } });
                localStorage.setItem("nexus_students", JSON.stringify(students));
            }
            localStorage.setItem("nexus_logged_user", JSON.stringify({ type: "student", name: name }));
            window.location.href = "aluno.html";
        };
    }

    // ==================== INICIALIZAÇÃO ====================
    function init() {
        const toggle = document.getElementById("darkModeToggle");
        if (localStorage.getItem("darkMode") === "enabled") document.body.classList.add("dark");
        toggle.onclick = () => {
            document.body.classList.toggle("dark");
            localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "enabled" : "disabled");
        };
        // Verifica se já tem sessão (já foi feito no início, mas por segurança)
        let saved = localStorage.getItem("nexus_logged_user");
        if (saved) {
            try {
                let user = JSON.parse(saved);
                if (user.type === "professor") window.location.href = "professor.html";
                else if (user.type === "student") window.location.href = "aluno.html";
                else showSplash(() => renderLoginScreen());
            } catch(e) { showSplash(() => renderLoginScreen()); }
        } else {
            showSplash(() => renderLoginScreen());
        }
    }
    init();
</script>
</body>
</html>
